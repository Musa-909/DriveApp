
name: DriveApp Docker Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: driveapp_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d driveapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEPLOYED: "true"
      DB_NAME: driveapp_test
      CONNECTION_STR: jdbc:postgresql://localhost:5432/
      DB_USERNAME: testuser
      DB_PASSWORD: testpassword
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TEST_INSTRUCTOR_EMAIL: ${{ secrets.TEST_INSTRUCTOR_EMAIL }}
      TEST_INSTRUCTOR_PASSWORD: ${{ secrets.TEST_INSTRUCTOR_PASSWORD }}
      TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
      TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Start DriveApp API
        run: |
          nohup java -jar target/app.jar > driveapp.log 2>&1 &
          echo $! > driveapp.pid

          for i in {1..30}; do
            if curl --fail --silent http://localhost:7070/api/health > /dev/null; then
              echo "DriveApp API is ready"
              exit 0
            fi
            sleep 2
          done

          cat driveapp.log
          exit 1

      # Create login accounts in the temporary test database
      - name: Create test users
        env:
          PGPASSWORD: testpassword
        run: |
          set -euo pipefail

          test -n "$TEST_INSTRUCTOR_EMAIL"
          test -n "$TEST_INSTRUCTOR_PASSWORD"
          test -n "$TEST_STUDENT_EMAIL"
          test -n "$TEST_STUDENT_PASSWORD"

          psql -h localhost -U testuser -d driveapp_test \
            -v instructor_email="$TEST_INSTRUCTOR_EMAIL" \
            -v instructor_password="$TEST_INSTRUCTOR_PASSWORD" \
            -v student_email="$TEST_STUDENT_EMAIL" \
            -v student_password="$TEST_STUDENT_PASSWORD" <<'SQL'
          \set ON_ERROR_STOP on

          CREATE EXTENSION IF NOT EXISTS pgcrypto;

          INSERT INTO instructors
            (name, email, password, phonenumber, role)
          VALUES
            (
              'Test Lærer',
              :'instructor_email',
              crypt(:'instructor_password', gen_salt('bf')),
              '12345678',
              'INSTRUCTOR'
            );

          INSERT INTO students
            (name, email, password, phonenumber, role)
          VALUES
            (
              'Test Elev',
              :'student_email',
              crypt(:'student_password', gen_salt('bf')),
              '87654321',
              'STUDENT'
            );
          SQL

      - name: Run automated tests
        run: mvn test

      - name: Show API logs on failure
        if: failure()
        run: |
          if [ -f driveapp.log ]; then
            cat driveapp.log
          fi

      - name: Stop DriveApp API
        if: always()
        run: |
          if [ -f driveapp.pid ]; then
            kill "$(cat driveapp.pid)" || true
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: amaanm3/driveapp:latest

